services:

  postgres:
    image: postgres:15-alpine
    container_name: ats_postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ats_dev
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: devpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ats_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: ats_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: ats_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

    environment:
      DATABASE_URL: postgresql+asyncpg://ats:devpass@postgres:5432/ats_dev
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev_secret_key_unsafe_do_not_use_in_production
      FRONTEND_URL: http://localhost:3000
      LANDING_URL: http://localhost:3001
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      DEBUG: "true"
      # MinIO (remplace S3 en local)
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_BUCKET: ats-cv-local
      AWS_REGION: eu-west-3
      STORAGE_BACKEND: s3
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker_parsing:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: ats_worker_parsing
    restart: unless-stopped
    volumes:
      - ./workers:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://ats:devpass@postgres:5432/ats_dev
      REDIS_URL: redis://redis:6379
      PARSING_QUEUE: parsing_jobs
      # MinIO
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_BUCKET: ats-cv-local
      AWS_REGION: eu-west-3
      PARSING_TIMEOUT: 30
      PARSING_MAX_RETRIES: 3
    env_file:
      - ./workers/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: python parsing_worker.py

  worker_email:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: ats_worker_email
    restart: unless-stopped
    volumes:
      - ./workers:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://ats:devpass@postgres:5435/ats_dev
      REDIS_URL: redis://redis:6379
      EMAIL_QUEUE: email_jobs
      # MailHog en local (pas de vrai envoi)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@ats-local.dev
      SMTP_TLS: "false"
    env_file:
      - ./workers/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python email_worker.py

  mailhog:
    image: mailhog/mailhog
    container_name: ats_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    logging:
      driver: none

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: dev
    container_name: ats_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_WS_URL: ws://localhost:8000
    env_file:
      - ./app/.env
    depends_on:
      - backend

  landing:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ats_landing
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
    env_file:
      - ./frontend/.env

volumes:
  postgres_data:
  redis_data:
  minio_data:
  app_node_modules:
  frontend_node_modules:
