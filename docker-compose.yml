services:
  postgres:
    image: postgres:15-alpine
    container_name: ats_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ats_dev
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: devpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ats_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========== BACKEND & WORKERS ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/venv
    environment:
      DATABASE_URL: postgresql://ats:devpass@postgres:5432/ats_dev
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev_secret_key_unsafe_do_not_use_in_production
      FRONTEND_URL: http://localhost:3000
      LANDING_URL: http://localhost:3001
      DEBUG: "true"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker_parsing:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: ats_worker_parsing
    restart: unless-stopped
    volumes:
      - ./workers:/app
      - worker_venv:/app/venv
    environment:
      DATABASE_URL: postgresql://ats:devpass@postgres:5432/ats_dev
      REDIS_URL: redis://redis:6379
      AWS_S3_BUCKET: ats-cv-local
      PARSING_QUEUE: parsing_jobs
    env_file:
      - ./workers/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python parsing_worker.py

  worker_email:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: ats_worker_email
    restart: unless-stopped
    volumes:
      - ./workers:/app
      - worker_venv:/app/venv
    environment:
      DATABASE_URL: postgresql://ats:devpass@postgres:5432/ats_dev
      REDIS_URL: redis://redis:6379
      EMAIL_QUEUE: email_jobs
    env_file:
      - ./workers/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python email_worker.py

  # ========== FRONTENDS ==========
  # ATS
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: dev
    container_name: ats_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    env_file:
      - ./app/.env
    depends_on:
      - backend

  landing:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ats_landing
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    env_file:
      - ./frontend/.env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  worker_venv:
  app_node_modules:
  frontend_node_modules:
